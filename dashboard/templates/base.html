<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blockchain Attack Lab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">B</span>
        <span>Blockchain Attack Lab</span>
      </a>
      <nav class="nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Overview</a>
        <a href="/runs" class="{% if request.url.path.startswith('/runs') %}active{% endif %}">Runs</a>
        <a href="/launch" class="{% if request.url.path == '/launch' %}active{% endif %}">New run</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Atelier 2 — simulation, détection et mitigation d'attaques blockchain</span>
      <span class="mono">PoW / PoS · C11 · FastAPI</span>
    </div>
  </footer>
</body>
</html>
